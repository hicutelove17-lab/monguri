name: Update Stock Prices

on:
  schedule:
    - cron: '0 * * * *'  # 留� �쒓컙留덈떎 �ㅽ뻾
  workflow_dispatch:      # �섎룞 �ㅽ뻾�� 媛���

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stock prices
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, time

          tickers = {
            "samsung": "005930.KS", "hynix": "000660.KS", "lgenergy": "373220.KS",
            "samsungbio": "207940.KS", "hyundai": "005380.KS", "hdheavy": "329180.KS",
            "sksquare": "402340.KS", "hanwhaaero": "012450.KS", "doosan": "034020.KS",
            "kbfin": "105560.KS", "kia": "000270.KS", "celltrion": "068270.KS",
            "samsungc": "028260.KS", "naver": "035420.KS", "shinhanjoo": "055550.KS",
            "hanwhao": "042660.KS", "hyundaimob": "012330.KS", "samsunglife": "032830.KS",
            "kepco": "015760.KS", "hdhyundai": "009540.KS",
            "nvda": "NVDA", "googl": "GOOGL", "aapl": "AAPL", "msft": "MSFT",
            "amzn": "AMZN", "tsm": "TSM", "avgo": "AVGO", "tsla": "TSLA",
            "meta": "META", "wmt": "WMT", "brk": "BRK-B", "lly": "LLY",
            "mu": "MU", "jpm": "JPM", "amd": "AMD", "xom": "XOM",
            "v": "V", "asml": "ASML", "orcl": "ORCL", "cost": "COST"
          }

          prices = {}
          headers = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
            "Accept": "application/json"
          }

          for key, ticker in tickers.items():
            try:
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?interval=1d&range=1d"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as res:
                data = json.loads(res.read())
                price = data["chart"]["result"][0]["meta"]["regularMarketPrice"]
                is_kr = ticker.endswith(".KS") or ticker.endswith(".KQ")
                prices[key] = round(price) if is_kr else round(price * 100) / 100
                print(f"�� {key}: {prices[key]}")
            except Exception as e:
              print(f"�� {key}: {e}")
            time.sleep(0.3)

          from datetime import datetime, timezone
          result = {
            "prices": prices,
            "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
            "count": len(prices)
          }

          with open("prices.json", "w") as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"\n珥� {len(prices)}/40 醫낅ぉ �섏쭛 �꾨즺")
          PYEOF

      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update stock prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
