<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 섹터 모니터</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1318;
    --border: #1a2430;
    --border-bright: #243040;
    --text: #e8edf2;
    --text-dim: #6b7f90;
    --text-muted: #3a4f60;
    --accent: #00d4ff;
    --accent-dim: rgba(0,212,255,0.1);
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.12);
    --red: #ff4d6a;
    --red-dim: rgba(255,77,106,0.12);
    --yellow: #ffd060;
    --font-mono: 'DM Mono', monospace;
    --font-display: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 14px; }
  .header-left h1 { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .header-left h1 span { color: var(--accent); }
  .header-sub { font-size: 10px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .last-updated { font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em; }

  .controls { display: flex; gap: 8px; align-items: center; }
  .refresh-btn {
    background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent);
    font-family: var(--font-mono); font-size: 11px; padding: 7px 16px; cursor: pointer;
    letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.2s;
  }
  .refresh-btn:hover { background: var(--accent); color: var(--bg); }
  .refresh-btn:disabled { opacity: 0.35; cursor: not-allowed; background: var(--accent-dim); color: var(--accent); }

  /* Progress */
  .progress-bar { height: 2px; background: var(--border); margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.3s ease; }

  /* Status */
  .status-bar { font-size: 11px; padding: 8px 14px; margin-bottom: 20px; letter-spacing: 0.04em; border: 1px solid; display: none; }
  .status-bar.error { display: block; color: var(--red); border-color: var(--red); background: var(--red-dim); }
  .status-bar.info { display: block; color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  /* Signal */
  .signal-banner {
    background: linear-gradient(135deg, rgba(0,212,255,0.04), rgba(167,139,250,0.04));
    border: 1px solid var(--border-bright); padding: 14px 18px; margin-bottom: 24px;
  }
  .signal-title { font-family: var(--font-display); font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .signal-text { font-size: 11px; color: var(--text-dim); line-height: 1.75; }
  .signal-text strong { color: var(--accent); }

  /* Tabs */
  .sector-tabs { display: flex; gap: 3px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .sector-tabs::-webkit-scrollbar { display: none; }
  .tab { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; padding: 7px 13px; cursor: pointer; white-space: nowrap; letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.15s; }
  .tab:hover { border-color: var(--border-bright); color: var(--text); }
  .tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .sector-section { display: none; }
  .sector-section.active { display: block; }

  .sector-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .sector-icon { font-size: 18px; }
  .sector-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
  .sector-signal { font-size: 10px; color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(0,212,255,0.2); padding: 6px 12px; margin-bottom: 14px; letter-spacing: 0.03em; }

  .stocks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 28px; }

  .stock-card {
    background: var(--surface); border: 1px solid var(--border); padding: 14px;
    transition: border-color 0.2s, transform 0.15s; position: relative; overflow: hidden;
  }
  .stock-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--card-accent, var(--accent)); transform: scaleX(0); transition: transform 0.25s; }
  .stock-card:hover { border-color: var(--border-bright); transform: translateY(-1px); }
  .stock-card:hover::before { transform: scaleX(1); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .ticker { font-family: var(--font-display); font-size: 17px; font-weight: 800; }
  .change-badge { font-size: 10px; font-weight: 500; padding: 2px 7px; letter-spacing: 0.04em; }
  .change-badge.up { background: var(--green-dim); color: var(--green); }
  .change-badge.down { background: var(--red-dim); color: var(--red); }
  .change-badge.flat { background: var(--border); color: var(--text-dim); }

  .company-name { font-size: 10px; color: var(--text-dim); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .price-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 10px; }
  .price { font-size: 20px; font-weight: 400; letter-spacing: -0.5px; }
  .price-loading { font-size: 20px; color: var(--text-muted); letter-spacing: -0.5px; }
  .price-change { font-size: 11px; }
  .price-change.up { color: var(--green); }
  .price-change.down { color: var(--red); }
  .price-change.flat { color: var(--text-dim); }

  .card-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; font-size: 9px; border-top: 1px solid var(--border); padding-top: 8px; }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-label { color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .meta-value { color: var(--text-dim); font-weight: 500; }

  .skeleton-pulse { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.25} 50%{opacity:0.7} }

  footer { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 8px; font-size: 10px; color: var(--text-muted); letter-spacing: 0.03em; line-height: 1.9; }

  @media(max-width:600px){ .stocks-grid{grid-template-columns:1fr 1fr;} .price{font-size:17px;} header{flex-direction:column;} .header-right{align-items:flex-start;} }
  @media(max-width:360px){ .stocks-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <h1>AI <span>섹터</span> 모니터</h1>
      <div class="header-sub">6 Sectors · 30 Stocks · ~15min delay</div>
    </div>
    <div class="header-right">
      <div class="last-updated" id="lastUpdated">데이터 로드 중...</div>
      <div class="controls">
        <button class="refresh-btn" id="refreshBtn" onclick="startLoad()">⟳ 새로고침</button>
      </div>
    </div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="status-bar" id="statusBar"></div>

  <div class="signal-banner">
    <div class="signal-title">🔭 2026 AI 큰 그림</div>
    <div class="signal-text">
      GPU 학습 → 추론(Inference) 최적화 → 에이전틱 AI 응용 → <strong>디지털 바이올로지</strong>로 이동 중.
      전력 인프라가 AI의 진짜 병목. 지금은 인프라 확장기 막바지 + 추론·응용 초입부.
    </div>
  </div>

  <div class="sector-tabs">
    <button class="tab active" onclick="switchTab(0)">전체보기</button>
    <button class="tab" onclick="switchTab(1)">🧠 AI 인프라</button>
    <button class="tab" onclick="switchTab(2)">⚡ 전력 인프라</button>
    <button class="tab" onclick="switchTab(3)">🤖 에이전틱 AI</button>
    <button class="tab" onclick="switchTab(4)">🧬 디지털 바이올로지</button>
    <button class="tab" onclick="switchTab(5)">☁️ 하이퍼스케일러</button>
    <button class="tab" onclick="switchTab(6)">🔗 AI 네트워킹</button>
  </div>

  <div id="section-0" class="sector-section active"></div>
  <div id="section-1" class="sector-section"></div>
  <div id="section-2" class="sector-section"></div>
  <div id="section-3" class="sector-section"></div>
  <div id="section-4" class="sector-section"></div>
  <div id="section-5" class="sector-section"></div>
  <div id="section-6" class="sector-section"></div>

  <footer>
    ※ 데이터: Yahoo Finance 비공식 API (최대 15분 지연) · 투자 참고용이며 실제 투자 결정은 본인 책임 하에 하시기 바랍니다
  </footer>

</div>
<script>
const SECTORS = [
  {
    id:1, icon:'🧠', title:'AI 인프라 — 반도체·메모리', color:'#00d4ff',
    signal:'HBM 2026년 완판. 추론 최적화 칩으로 수요 이동 중. MU Forward P/E ~9x 저평가.',
    tickers:[{t:'NVDA',n:'Nvidia'},{t:'AMD',n:'AMD'},{t:'MU',n:'Micron Technology'},{t:'AVGO',n:'Broadcom'},{t:'MRVL',n:'Marvell Technology'}]
  },
  {
    id:2, icon:'⚡', title:'전력 인프라', color:'#ffd060',
    signal:'그리드 연결 대기 4년 이상. GEV 수주잔고 1,500억$. AI 테마로 완전 재평가 안 됨.',
    tickers:[{t:'GEV',n:'GE Vernova'},{t:'VRT',n:'Vertiv Holdings'},{t:'CEG',n:'Constellation Energy'},{t:'ETN',n:'Eaton Corp'},{t:'VST',n:'Vistra Corp'}]
  },
  {
    id:3, icon:'🤖', title:'에이전틱 AI 소프트웨어', color:'#a78bfa',
    signal:'SaaS 셀오프로 CRM·NOW 저평가 구간. CRM PEG 0.6x. Agentforce ARR +330%.',
    tickers:[{t:'CRM',n:'Salesforce'},{t:'NOW',n:'ServiceNow'},{t:'PLTR',n:'Palantir'},{t:'PATH',n:'UiPath'},{t:'DDOG',n:'Datadog'}]
  },
  {
    id:4, icon:'🧬', title:'디지털 바이올로지', color:'#00e5a0',
    signal:'"AI의 다음 물결은 생물학" — 젠슨 황. AlphaFold3 이후 신약개발 AI 실전 적용 가속.',
    tickers:[{t:'ISRG',n:'Intuitive Surgical'},{t:'ILMN',n:'Illumina'},{t:'RXRX',n:'Recursion Pharma'},{t:'SDGR',n:'Schrödinger'},{t:'SEER',n:'Seer Bio'}]
  },
  {
    id:5, icon:'☁️', title:'하이퍼스케일러', color:'#ff8c42',
    signal:'2026년 AI 캐펙스 합산 7,100억$. AWS +24% · Google Cloud +48% · Azure +39% 성장.',
    tickers:[{t:'MSFT',n:'Microsoft'},{t:'GOOGL',n:'Alphabet'},{t:'AMZN',n:'Amazon'},{t:'META',n:'Meta'},{t:'ORCL',n:'Oracle'}]
  },
  {
    id:6, icon:'🔗', title:'AI 네트워킹·인터커넥트', color:'#f472b6',
    signal:'AI 클러스터 비용의 10~15%가 네트워킹. Arista 2026 AI 네트워킹 매출 2배 전망.',
    tickers:[{t:'ANET',n:'Arista Networks'},{t:'CIEN',n:'Ciena Corp'},{t:'CRDO',n:'Credo Technology'},{t:'LITE',n:'Lumentum'},{t:'COHR',n:'Coherent Corp'}]
  }
];

// Multiple proxy fallbacks tried in sequence
const PROXIES = [
  t => `https://corsproxy.io/?${encodeURIComponent('https://query1.finance.yahoo.com/v7/finance/quote?symbols='+t+'&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,regularMarketDayHigh,regularMarketDayLow,regularMarketVolume')}`,
  t => `https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v7/finance/quote?symbols='+t+'&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,regularMarketDayHigh,regularMarketDayLow,regularMarketVolume')}`,
  t => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent('https://query1.finance.yahoo.com/v7/finance/quote?symbols='+t+'&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,regularMarketDayHigh,regularMarketDayLow,regularMarketVolume')}`,
  t => `https://thingproxy.freeboard.io/fetch/https://query1.finance.yahoo.com/v7/finance/quote?symbols=${t}&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,regularMarketDayHigh,regularMarketDayLow,regularMarketVolume`
];

let cache = {};
let currentTab = 0;

async function fetchQuotes(tickers) {
  const sym = tickers.join(',');
  for (let i = 0; i < PROXIES.length; i++) {
    try {
      const url = PROXIES[i](sym);
      const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const text = await res.text();
      // allorigins wraps in {contents:...}
      let parsed;
      try {
        const outer = JSON.parse(text);
        parsed = outer.contents ? JSON.parse(outer.contents) : outer;
      } catch { continue; }
      const results = parsed?.quoteResponse?.result;
      if (!results?.length) continue;
      results.forEach(q => {
        cache[q.symbol] = {
          price: q.regularMarketPrice,
          change: q.regularMarketChange,
          changePct: q.regularMarketChangePercent,
          high: q.regularMarketDayHigh,
          low: q.regularMarketDayLow,
          volume: q.regularMarketVolume
        };
      });
      return true; // success
    } catch(e) { /* try next proxy */ }
  }
  return false;
}

function fmtPrice(n) { return n != null ? '$'+n.toFixed(2) : '--'; }
function fmtChange(n) { return n != null ? (n>=0?'+':'')+n.toFixed(2) : '--'; }
function fmtPct(n) { return n != null ? (n>=0?'+':'')+n.toFixed(2)+'%' : '--'; }
function fmtVol(n) {
  if (n == null) return '--';
  if (n>=1e9) return (n/1e9).toFixed(1)+'B';
  if (n>=1e6) return (n/1e6).toFixed(1)+'M';
  if (n>=1e3) return (n/1e3).toFixed(0)+'K';
  return n;
}
function fmtNum(n) { return n != null ? (n>=1000?(n/1000).toFixed(1)+'K':n.toFixed(2)) : '--'; }

function buildCard(ticker, name, color) {
  const d = cache[ticker];
  const dir = d ? (d.change > 0.005 ? 'up' : d.change < -0.005 ? 'down' : 'flat') : 'flat';

  return `<div class="stock-card" style="--card-accent:${color}">
    <div class="card-top">
      <div class="ticker">${ticker}</div>
      <div class="change-badge ${dir}">${d ? fmtPct(d.changePct) : '--'}</div>
    </div>
    <div class="company-name">${name}</div>
    <div class="price-row">
      ${d
        ? `<div class="price" style="color:${dir==='up'?'var(--green)':dir==='down'?'var(--red)':'var(--text)'}">${fmtPrice(d.price)}</div>
           <div class="price-change ${dir}">${fmtChange(d.change)}</div>`
        : `<div class="price-loading skeleton-pulse">---</div>`
      }
    </div>
    <div class="card-meta">
      <div class="meta-item"><div class="meta-label">고가</div><div class="meta-value">${d?'$'+fmtNum(d.high):'--'}</div></div>
      <div class="meta-item"><div class="meta-label">저가</div><div class="meta-value">${d?'$'+fmtNum(d.low):'--'}</div></div>
      <div class="meta-item"><div class="meta-label">거래량</div><div class="meta-value">${d?fmtVol(d.volume):'--'}</div></div>
    </div>
  </div>`;
}

function renderSection(sectorIdx, containerId) {
  const s = SECTORS[sectorIdx];
  const cards = s.tickers.map(({t,n}) => buildCard(t,n,s.color)).join('');
  document.getElementById(containerId).innerHTML = `
    <div class="sector-header">
      <div class="sector-icon">${s.icon}</div>
      <div><div class="sector-title">${s.title}</div></div>
    </div>
    <div class="sector-signal">📡 ${s.signal}</div>
    <div class="stocks-grid">${cards}</div>`;
}

function renderAll() {
  document.getElementById('section-0').innerHTML = SECTORS.map((s,i) => {
    const cards = s.tickers.map(({t,n}) => buildCard(t,n,s.color)).join('');
    return `<div class="sector-header">
      <div class="sector-icon">${s.icon}</div>
      <div><div class="sector-title">${s.title}</div><div style="font-size:10px;color:var(--text-dim);margin-top:2px">${s.signal}</div></div>
    </div>
    <div class="stocks-grid" style="margin-bottom:28px">${cards}</div>`;
  }).join('');
}

function renderCurrentTab() {
  if (currentTab === 0) { renderAll(); return; }
  renderSection(currentTab-1, `section-${currentTab}`);
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.sector-section').forEach((s,i) => s.classList.toggle('active', i===idx));
  renderCurrentTab();
}

function setStatus(msg, type) {
  const el = document.getElementById('statusBar');
  if (!msg) { el.style.display='none'; return; }
  el.className = `status-bar ${type}`;
  el.textContent = msg;
}

async function startLoad() {
  const btn = document.getElementById('refreshBtn');
  const fill = document.getElementById('progressFill');
  btn.disabled = true;
  fill.style.width = '5%';
  setStatus('데이터 로딩 중...', 'info');

  // Render skeletons immediately
  renderCurrentTab();

  const allTickers = SECTORS.flatMap(s => s.tickers.map(t => t.t));
  // Batch into groups of 5 to avoid URL length issues
  const batches = [];
  for (let i = 0; i < allTickers.length; i += 5) batches.push(allTickers.slice(i, i+5));

  let loaded = 0;
  let failed = 0;

  for (const batch of batches) {
    const ok = await fetchQuotes(batch);
    if (!ok) failed += batch.length;
    loaded += batch.length;
    fill.style.width = Math.round((loaded / allTickers.length) * 95) + '%';
    renderCurrentTab();
    await new Promise(r => setTimeout(r, 300)); // small delay between batches
  }

  fill.style.width = '100%';
  setTimeout(() => { fill.style.width = '0%'; }, 800);

  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    '업데이트: ' + now.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

  btn.disabled = false;
  const loaded_count = Object.keys(cache).length;
  if (loaded_count === 0) {
    setStatus(`⚠ 데이터 로드 실패 — CORS 차단. 아래 대체 방법을 확인해 주세요.`, 'error');
  } else if (loaded_count < allTickers.length) {
    setStatus(`✓ ${loaded_count}개 로드 완료 · ${allTickers.length - loaded_count}개 실패`, 'info');
  } else {
    setStatus('', '');
  }
}

// Auto-refresh every 3 minutes
setInterval(() => { if (!document.getElementById('refreshBtn').disabled) startLoad(); }, 180000);

startLoad();
</script>
</body>
</html>
